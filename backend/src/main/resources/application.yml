spring:
  application:
    name: orion-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${DB_USER:orion}
    password: ${DB_PASSWORD:orion_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # OJO: no poner hibernate.jdbc.time_zone. Desplaza también las columnas TIME (hora de pared,
    # sin zona) por el offset del servidor: una regla 18:00–21:00 acabaría guardada como
    # 23:00–02:00. Los Instant sobre TIMESTAMPTZ ya guardan el momento absoluto sin ayuda.

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Fotos de perfil hasta 5 MB; documentos de postulación hasta 10 MB. El límite fino por tipo de
  # archivo lo pone cada servicio (PhotoService 5 MB, TeacherDocumentService 10 MB).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # El módulo notifications necesita el bean JavaMailSender, así que la config de correo vive
  # aquí y no solo en el perfil local. En desarrollo apunta a Mailpit (SMTP falso, puerto 1025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Sin timeouts, JavaMail espera para siempre: un SMTP inalcanzable colgaría el hilo de la
          # petición (el envío tras el commit es síncrono). Con esto, un correo que no sale FALLA
          # rápido —se registra y se sigue— en vez de colgar la reserva. Milisegundos.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

orion:
  app:
    # Origen público del frontend; base de los enlaces que van en correos (recuperación, etc.).
    base-url: ${ORION_APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ORION_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  payments:
    # Sandbox por defecto: una clave de producción tiene que ponerse a propósito, nunca por
    # heredarla del fichero. Las tres claves van SIEMPRE por variable de entorno — el repositorio
    # no ve un secreto ni en local.
    #
    # La llave PRIVADA de Wompi no aparece aquí porque este flujo no la necesita: el Web Checkout
    # se firma con el secreto de integridad, el webhook se verifica con el de eventos y la consulta
    # de una transacción va con la llave pública. La privada solo hace falta para crear
    # transacciones desde el servidor o anularlas, y no hacemos ninguna de las dos. Un secreto de
    # producción que no se usa es superficie de ataque gratis.
    wompi:
      api-base-url:     ${WOMPI_API_BASE_URL:https://sandbox.wompi.co/v1}
      checkout-url:     ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
      public-key:       ${WOMPI_PUBLIC_KEY:}
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      events-secret:    ${WOMPI_EVENTS_SECRET:}
    expiry-job:
      # Cada 5 minutos: el plazo para pagar son 20 (platform_settings.payment_hold_minutes), así que
      # un cupo nunca queda bloqueado más de 25.
      interval-ms: ${ORION_PAYMENT_EXPIRY_INTERVAL_MS:300000}
  # Quién responde por Orión. Aparece en los términos, en la política de tratamiento y en la
  # pantalla de ayuda.
  #
  # No son secretos: la ley EXIGE publicarlos (art. 50 de la Ley 1480 de 2011 para la identidad del
  # proveedor, art. 13 del Decreto 1377 de 2013 para la del responsable del tratamiento). Por eso
  # llevan valor por defecto y no se comportan como los WOMPI_*. Aun así, el perfil prod los pide
  # por variable de entorno: cambiar de domicilio no debería exigir un despliegue.
  legal:
    responsable: ${ORION_LEGAL_NOMBRE:Diego Alejandro Pardo Montero}
    documento:   ${ORION_LEGAL_DOCUMENTO:C.C. 1.013.576.324}
    domicilio:   ${ORION_LEGAL_DOMICILIO:Carrera 32 #28-08}
    ciudad:      ${ORION_LEGAL_CIUDAD:Bogotá D.C.}
    correo:      ${ORION_LEGAL_CORREO:diegopardomontero@gmail.com}
    whatsapp:    ${ORION_LEGAL_WHATSAPP:+573023063447}
    horario:     ${ORION_LEGAL_HORARIO:Lunes a viernes de 8:00 a. m. a 6:00 p. m.}
  # Alertas de operación al correo de quien lleva Orión. Sin servicio externo: el correo ya
  # funciona, ya lleva marca y ya llega; un Sentry para decir lo que un correo puede decir sería
  # una dependencia más que mantener y una cuenta más que alguien tendría que acordarse de mirar.
  #
  # El freno no es una optimización: un error en bucle mandaría seiscientos correos, la bandeja se
  # saturaría y a la semana nadie los abriría — y una bandeja que nadie abre es igual de ciega que
  # no tener alertas.
  alerts:
    to: ${ORION_ALERTS_TO:diegopardomontero@gmail.com}
    enabled: ${ORION_ALERTS_ENABLED:true}
    per-signature-minutes: ${ORION_ALERTS_PER_SIGNATURE_MINUTES:60}
    daily-cap: ${ORION_ALERTS_DAILY_CAP:50}
    watchdog:
      interval-ms: ${ORION_ALERTS_WATCHDOG_INTERVAL_MS:900000}
      # Un retraso al arrancar evita avisar de procesos que todavía no han tenido su turno.
      initial-delay-ms: ${ORION_ALERTS_WATCHDOG_INITIAL_DELAY_MS:900000}
  mail:
    from: ${ORION_MAIL_FROM:no-reply@orion.local}
    # Transporte del correo: 'smtp' (Mailpit en local) o 'resend' (API HTTP en prod, porque Railway
    # bloquea los puertos SMTP salientes). Se sobrescribe en el perfil prod.
    transport: ${ORION_MAIL_TRANSPORT:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}

server:
  servlet:
    session:
      cookie:
        name: ORION_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Un servidor de correo caído no deja a Orión "no saludable": las reservas siguen
    # funcionando (el envío es AFTER_COMMIT y su fallo solo se registra en el log).
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
