spring:
  application:
    name: orion-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${DB_USER:orion}
    password: ${DB_PASSWORD:orion_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # OJO: no poner hibernate.jdbc.time_zone. Desplaza también las columnas TIME (hora de pared,
    # sin zona) por el offset del servidor: una regla 18:00–21:00 acabaría guardada como
    # 23:00–02:00. Los Instant sobre TIMESTAMPTZ ya guardan el momento absoluto sin ayuda.

  flyway:
    enabled: true
    locations: classpath:db/migration

  # El módulo notifications necesita el bean JavaMailSender, así que la config de correo vive
  # aquí y no solo en el perfil local. En desarrollo apunta a Mailpit (SMTP falso, puerto 1025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

orion:
  app:
    # Origen público del frontend; base de los enlaces que van en correos (recuperación, etc.).
    base-url: ${ORION_APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ORION_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${ORION_MAIL_FROM:no-reply@orion.local}

server:
  servlet:
    session:
      cookie:
        name: ORION_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Un servidor de correo caído no deja a Orión "no saludable": las reservas siguen
    # funcionando (el envío es AFTER_COMMIT y su fallo solo se registra en el log).
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
