spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Producción envía por la API HTTP de Resend, no por SMTP (ver orion.mail.transport abajo). Los
  # MAIL_* llevan default para que el arranque no dependa de ellos; solo importan si se conmuta a
  # ORION_MAIL_TRANSPORT=smtp (p. ej. en un host que sí permita el 587).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  # TLS termina en el edge de Railway; el backend ve HTTP plano. Con esto Spring confía en los
  # X-Forwarded-*, así las cookies Secure y las URLs generadas salen bien. Sin esto, todo parece
  # funcionar hasta que las cookies no llegan.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ORION_SESSION
        http-only: true
        secure: true
        same-site: lax

orion:
  app:
    base-url: ${ORION_APP_BASE_URL}
  # Sin valor por defecto a propósito: publicar Orion sin domicilio de notificaciones incumple
  # el art. 50 de la Ley 1480, así que preferimos que no arranque a que arranque mintiendo.
  legal:
    responsable: ${ORION_LEGAL_NOMBRE}
    documento:   ${ORION_LEGAL_DOCUMENTO}
    domicilio:   ${ORION_LEGAL_DOMICILIO}
    ciudad:      ${ORION_LEGAL_CIUDAD}
    correo:      ${ORION_LEGAL_CORREO}
    whatsapp:    ${ORION_LEGAL_WHATSAPP}
    horario:     ${ORION_LEGAL_HORARIO}
  mail:
    from: ${ORION_MAIL_FROM}
    # Producción envía por la API HTTP de Resend (443), no por SMTP: Railway bloquea el puerto 587.
    transport: ${ORION_MAIL_TRANSPORT:resend}
    resend:
      api-key: ${RESEND_API_KEY:}
  cors:
    allowed-origins: ${ORION_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  # health.mail.enabled=false se hereda de application.yml: un SMTP caído no marca la app como
  # "no saludable", porque el envío es AFTER_COMMIT y su fallo no afecta a las reservas.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
