# Claves de pasarela FALSAS para los tests. No son secretos: son constantes conocidas, y tienen que
# serlo — la firma del webhook se verifica contra el mismo secreto con el que el test la calcula.
#
# Va en application.properties y no en application.yml a propósito: un application.yml en
# src/test/resources ocultaría por completo el del módulo principal (mismo nombre, classpath de test
# primero) y los tests dejarían de ejercitar la configuración real. En .properties, ambos se cargan
# y estas claves solo pisan las tres que nombran.
orion.payments.wompi.public-key=pub_test_orion_fake
orion.payments.wompi.integrity-secret=test_integrity_orion
orion.payments.wompi.events-secret=test_events_orion

# El job de expiración no se dispara solo durante los tests: cada uno provoca la expiración cuando
# le toca. Una hora es "nunca" para un test.
orion.payments.expiry-job.interval-ms=3600000
