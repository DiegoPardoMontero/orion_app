# Claves de pasarela FALSAS para los tests. No son secretos: son constantes conocidas, y tienen que
# serlo — la firma del webhook se verifica contra el mismo secreto con el que el test la calcula.
#
# Va en application.properties y no en application.yml a propósito: un application.yml en
# src/test/resources ocultaría por completo el del módulo principal (mismo nombre, classpath de test
# primero) y los tests dejarían de ejercitar la configuración real. En .properties, ambos se cargan
# y estas claves solo pisan las tres que nombran.
orion.payments.wompi.public-key=pub_test_orion_fake
orion.payments.wompi.integrity-secret=test_integrity_orion
orion.payments.wompi.events-secret=test_events_orion

# El job de expiración no se dispara solo durante los tests: cada uno provoca la expiración cuando
# le toca. Una hora es "nunca" para un test.
orion.payments.expiry-job.interval-ms=3600000

# Alertas apagadas en la suite. No es solo por no mandar correo: el vigilante de procesos vería
# jobs que en un test nunca corren y llenaría la salida de falsos positivos.
orion.alerts.enabled=false
orion.alerts.watchdog.initial-delay-ms=86400000

# El resumen diario de devoluciones tampoco se dispara solo en la suite.
orion.alerts.refunds.cron=0 0 5 31 2 *

# Un solo Postgres para toda la suite (ver TestcontainersConfiguration), y unos treinta contextos de
# Spring vivos a la vez: con el pool por defecto (10 fijas por contexto) se piden trescientas
# conexiones a una base que admite cien, y los tests empiezan a fallar con «Connection is not
# available» — un error que no dice nada de lo que de verdad pasa.
#
# minimum-idle=0 es lo que más ayuda: un contexto que no está corriendo tests suelta sus conexiones
# en vez de retenerlas. El máximo de 4 es holgado para un test de un hilo que además dispara
# listeners con REQUIRES_NEW.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
