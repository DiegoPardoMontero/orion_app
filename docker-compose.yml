services:
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_local
    ports:
      - "5432:5432"
    volumes:
      - orion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: orion-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  orion_pgdata:
